services:
  dev:
    image: faraday-fieldbook-devcontainer
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
    container_name: faraday-fieldbook
    init: true
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - dev_history:/home/user/.history
    user: "${USER_UID}:${USER_GID}"
    environment:
      HOME: /home/user
    command: sleep infinity

volumes:
  dev_history:
    name: dev_history
