[project]
name = "voteprep"
version = "0.1.0"
description = "A voteprep project"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = []

[dependency-groups]
dev = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
